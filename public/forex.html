<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cryptapex FX Lab</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #0f1419; }
    .fx-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; background: #161b22; border-bottom: 1px solid #30363d;
    }
    .fx-balance { font-weight: 600; }
    .fx-container { max-width: 480px; margin: 0 auto; padding: 16px; }
    .card {
      background: #161b22; border: 1px solid #30363d; border-radius: 12px;
      padding: 16px; margin-bottom: 16px;
    }
    .card h3 { margin: 0 0 12px; font-size: 18px; }
    select, input {
      width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d;
      border-radius: 8px; color: #e6edf3; margin-bottom: 12px; font-size: 15px;
    }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .btn-buy { background: #238636; color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-sell { background: #da3633; color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .trade-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid #30363d; font-size: 14px;
    }
    .trade-item:last-child { border-bottom: none; }
    .win { color: #3fb950; }
    .loss { color: #f85149; }
    .status-badge {
      padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
    }
    .status-expired { background: #6e7681; color: #fff; }
    .status-win { background: #238636; color: #fff; }
    .status-loss { background: #da3633; color: #fff; }
    .status-active { background: #d29922; color: #000; }
  </style>
</head>
<body>
  <div class="fx-header">
    <div><span style="color:#f0b90b;font-size:20px;">₿</span> <strong>FX Lab</strong></div>
    <div class="fx-balance">Balance: <span id="balance">$0.00</span></div>
    <a href="/" style="color:#8b949e;text-decoration:none;">← Back</a>
  </div>

  <div class="fx-container">
    <div class="card">
      <h3>Assets</h3>
      <select id="asset">
        <option value="EURUSD">EURUSD</option>
        <option value="GBPUSD">GBPUSD</option>
        <option value="USDJPY">USDJPY</option>
        <option value="BTCUSD">BTCUSD</option>
        <option value="XAUUSD">XAUUSD</option>
        <option value="AUDUSD">AUDUSD</option>
      </select>
      <div class="row">
        <select id="currency" style="max-width:80px;"><option>USD</option></select>
        <input type="number" id="amount" placeholder="Amount" value="100" min="10" />
      </div>
      <select id="leverage">
        <option value="1">1:1</option>
        <option value="10">1:10</option>
        <option value="50">1:50</option>
        <option value="100" selected>1:100</option>
        <option value="200">1:200</option>
      </select>
      <select id="duration">
        <option value="1">1 Minute</option>
        <option value="5" selected>5 Minutes</option>
        <option value="15">15 Minutes</option>
        <option value="30">30 Minutes</option>
        <option value="60">1 Hour</option>
      </select>
      <div class="row">
        <button class="btn-buy" id="buy-btn">BUY</button>
        <button class="btn-sell" id="sell-btn">SELL</button>
      </div>
      <div id="msg" style="margin-top:8px;font-size:13px;"></div>
    </div>

    <div class="card">
      <h3>Transfer from Cryptapex</h3>
      <input type="number" id="transfer-amount" placeholder="Amount to transfer" />
      <button id="transfer-btn" style="width:100%;padding:10px;background:#f0b90b;border:none;border-radius:8px;font-weight:600;cursor:pointer;">Transfer</button>
    </div>

    <div class="card">
      <h3>Latest Trades</h3>
      <div id="trades-list">
        <p style="color:#8b949e;font-size:13px;">No trades yet</p>
      </div>
    </div>
  </div>

  <script>
    let balance = parseFloat(localStorage.getItem('fxBalance') || '0');
    let trades = JSON.parse(localStorage.getItem('fxTrades') || '[]');

    function updateBalance() {
      document.getElementById('balance').textContent = '$' + balance.toFixed(2);
      localStorage.setItem('fxBalance', balance);
    }

    function saveTrades() {
      localStorage.setItem('fxTrades', JSON.stringify(trades));
    }

    function renderTrades() {
      const el = document.getElementById('trades-list');
      if (trades.length === 0) {
        el.innerHTML = '<p style="color:#8b949e;font-size:13px;">No trades yet</p>';
        return;
      }
      el.innerHTML = trades.slice().reverse().slice(0, 10).map(t => {
        const statusClass = t.status === 'win' ? 'status-win' : t.status === 'loss' ? 'status-loss' : t.status === 'active' ? 'status-active' : 'status-expired';
        const statusText = t.status === 'win' ? 'WIN +' + t.payout + '%' : t.status === 'loss' ? 'LOSS' : t.status === 'active' ? 'Active' : 'Expired';
        return `
          <div class="trade-item">
            <div>
              <div style="font-weight:600;color:${t.side==='buy'?'#3fb950':'#f85149'}">${t.side==='buy'?'↑':'↓'} ${t.asset}</div>
              <div style="color:#8b949e;font-size:12px;">${new Date(t.time).toLocaleString()}</div>
            </div>
            <div>$${t.amount}</div>
            <div><span class="status-badge ${statusClass}">${statusText}</span></div>
          </div>
        `;
      }).join('');
    }

    function placeTrade(side) {
      const amount = parseFloat(document.getElementById('amount').value);
      const asset = document.getElementById('asset').value;
      const duration = parseInt(document.getElementById('duration').value);
      const msg = document.getElementById('msg');

      if (!amount || amount < 10) { msg.textContent = 'Minimum $10'; msg.style.color = '#f85149'; return; }
      if (balance < amount) { msg.textContent = 'Insufficient balance'; msg.style.color = '#f85149'; return; }

      balance -= amount;
      const trade = {
        id: Date.now(),
        asset, side, amount, duration,
        time: new Date().toISOString(),
        status: 'active',
        payout: 85
      };
      trades.push(trade);
      updateBalance();
      saveTrades();
      renderTrades();
      msg.textContent = `${side.toUpperCase()} $${amount} ${asset} placed`;
      msg.style.color = '#3fb950';

      // Simulate result after duration (shortened for demo: 10 seconds = 1 minute)
      setTimeout(() => {
        const win = Math.random() > 0.45;
        trade.status = win ? 'win' : 'loss';
        if (win) {
          const profit = amount * (trade.payout / 100);
          balance += amount + profit;
        }
        updateBalance();
        saveTrades();
        renderTrades();
      }, duration * 10000); // 10 sec per minute for demo
    }

    document.getElementById('buy-btn').addEventListener('click', () => placeTrade('buy'));
    document.getElementById('sell-btn').addEventListener('click', () => placeTrade('sell'));

    document.getElementById('transfer-btn').addEventListener('click', async () => {
      const amount = parseFloat(document.getElementById('transfer-amount').value);
      const token = localStorage.getItem('token');
      if (!token) { alert('Log in on the main site first'); return; }
      if (!amount || amount <= 0) return;
      try {
        const res = await fetch('/api/transfer-to-fx', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ amount })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        balance += data.transferred;
        updateBalance();
        alert('Transferred $' + data.transferred);
        document.getElementById('transfer-amount').value = '';
      } catch (e) { alert(e.message); }
    });

    updateBalance();
    renderTrades();
  </script>
</body>
</html>
