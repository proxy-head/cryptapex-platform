<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cryptapex Forex – Trading</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; }
    .fx-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .fx-balance {
      font-weight: 600;
      font-size: 15px;
    }
    .fx-layout {
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      height: calc(100vh - 60px);
    }
    .pairs-list {
      background: var(--card);
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }
    .pair-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pair-item:hover, .pair-item.active {
      background: rgba(240,185,11,0.08);
    }
    .pair-item .name { font-weight: 600; }
    .pair-item .price { font-size: 14px; }
    .pair-item .change.up { color: var(--green); }
    .pair-item .change.down { color: var(--red); }
    .chart-area {
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .chart-placeholder {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
    }
    .trade-panel {
      background: var(--card);
      border-left: 1px solid var(--border);
      padding: 20px;
      overflow-y: auto;
    }
    .trade-panel h3 { margin-bottom: 16px; }
    .lot-input, .price-display {
      margin-bottom: 14px;
    }
    .lot-input input {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
    }
    .side-btns {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    .side-btns button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .buy-btn { background: var(--green); color: #000; }
    .sell-btn { background: var(--red); color: #fff; }
    .positions {
      margin-top: 24px;
    }
    .position-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .close-btn {
      float: right;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="fx-header">
    <div>
      <span class="logo-icon small">₿</span>
      <span class="brand">Cryptapex Forex</span>
    </div>
    <div class="fx-balance">Demo Balance: <span id="balance">$10,000.00</span></div>
    <a href="/" class="btn ghost">← Back to Crypto</a>
  </div>

  <div class="fx-layout">
    <!-- Pairs List -->
    <div class="pairs-list" id="pairs-list"></div>

    <!-- Chart Area -->
    <div class="chart-area">
      <h2 id="selected-pair">EUR/USD</h2>
      <div class="chart-placeholder">
        Live price chart (demo)<br>
        <span id="big-price" style="font-size:32px;font-weight:700;color:var(--text);margin-top:12px;display:block;">1.0850</span>
      </div>
    </div>

    <!-- Trade Panel -->
    <div class="trade-panel">
      <h3>Place Order</h3>
      <div class="price-display">
        <div>Bid: <strong id="bid">1.0848</strong></div>
        <div>Ask: <strong id="ask">1.0852</strong></div>
      </div>
      <div class="lot-input">
        <label>Lot Size</label>
        <input type="number" id="lots" value="0.01" min="0.01" step="0.01" />
      </div>
      <div class="side-btns">
        <button class="buy-btn" id="buy-btn">BUY</button>
        <button class="sell-btn" id="sell-btn">SELL</button>
      </div>
      <div id="trade-msg" class="msg hidden"></div>

      <div class="positions">
        <h4>Open Positions</h4>
        <div id="positions-list">
          <p style="color:var(--muted);font-size:13px;">No open positions</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const pairs = [
      { pair: 'EUR/USD', price: 1.0850, digits: 4 },
      { pair: 'GBP/USD', price: 1.2650, digits: 4 },
      { pair: 'USD/JPY', price: 149.50, digits: 2 },
      { pair: 'USD/CHF', price: 0.8820, digits: 4 },
      { pair: 'AUD/USD', price: 0.6550, digits: 4 },
      { pair: 'USD/CAD', price: 1.3650, digits: 4 },
      { pair: 'NZD/USD', price: 0.6050, digits: 4 },
      { pair: 'EUR/GBP', price: 0.8570, digits: 4 },
      { pair: 'EUR/JPY', price: 162.30, digits: 2 },
      { pair: 'GBP/JPY', price: 189.20, digits: 2 },
      { pair: 'AUD/JPY', price: 97.90, digits: 2 },
      { pair: 'EUR/AUD', price: 1.6550, digits: 4 },
      { pair: 'EUR/CAD', price: 1.4820, digits: 4 },
      { pair: 'GBP/AUD', price: 1.9320, digits: 4 },
      { pair: 'XAU/USD', price: 2650.00, digits: 2 },
      { pair: 'XAG/USD', price: 31.50, digits: 2 },
      { pair: 'USD/SGD', price: 1.3450, digits: 4 },
      { pair: 'EUR/CHF', price: 0.9570, digits: 4 },
      { pair: 'GBP/CHF', price: 1.1160, digits: 4 },
      { pair: 'AUD/CAD', price: 0.8940, digits: 4 }
    ];

    let selected = pairs[0];
    let balance = 10000;
    let positions = [];
    let positionId = 1;

    function formatPrice(p, digits) {
      return p.toFixed(digits);
    }

    function renderPairs() {
      const list = document.getElementById('pairs-list');
      list.innerHTML = pairs.map(p => {
        const change = (Math.random() - 0.5) * 0.001 * p.price;
        const up = change >= 0;
        return `
          <div class="pair-item ${p.pair === selected.pair ? 'active' : ''}" data-pair="${p.pair}">
            <div>
              <div class="name">${p.pair}</div>
              <div class="change ${up ? 'up' : 'down'}">${up ? '+' : ''}${(change).toFixed(p.digits === 2 ? 2 : 5)}</div>
            </div>
            <div class="price">${formatPrice(p.price, p.digits)}</div>
          </div>
        `;
      }).join('');

      list.querySelectorAll('.pair-item').forEach(el => {
        el.addEventListener('click', () => {
          selected = pairs.find(x => x.pair === el.dataset.pair);
          updateSelected();
          renderPairs();
        });
      });
    }

    function updateSelected() {
      document.getElementById('selected-pair').textContent = selected.pair;
      document.getElementById('big-price').textContent = formatPrice(selected.price, selected.digits);
      const spread = selected.digits === 2 ? 0.02 : 0.0002;
      document.getElementById('bid').textContent = formatPrice(selected.price - spread/2, selected.digits);
      document.getElementById('ask').textContent = formatPrice(selected.price + spread/2, selected.digits);
    }

    function updateBalance() {
      document.getElementById('balance').textContent = '$' + balance.toFixed(2);
    }

    function renderPositions() {
      const el = document.getElementById('positions-list');
      if (positions.length === 0) {
        el.innerHTML = '<p style="color:var(--muted);font-size:13px;">No open positions</p>';
        return;
      }
      el.innerHTML = positions.map(pos => `
        <div class="position-row">
          <strong>${pos.pair}</strong> ${pos.side.toUpperCase()} ${pos.lots} lots
          <br>Entry: ${formatPrice(pos.entry, pos.digits)}
          <button class="close-btn" data-id="${pos.id}">Close</button>
        </div>
      `).join('');

      el.querySelectorAll('.close-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const pos = positions.find(p => p.id === id);
          if (pos) {
            const pnl = (Math.random() - 0.45) * pos.lots * 100; // simulated PnL
            balance += pnl;
            positions = positions.filter(p => p.id !== id);
            updateBalance();
            renderPositions();
          }
        });
      });
    }

    function placeTrade(side) {
      const lots = parseFloat(document.getElementById('lots').value) || 0.01;
      if (lots < 0.01) return;
      const msg = document.getElementById('trade-msg');
      positions.push({
        id: positionId++,
        pair: selected.pair,
        side,
        lots,
        entry: selected.price,
        digits: selected.digits
      });
      msg.textContent = `${side.toUpperCase()} ${lots} lots ${selected.pair} opened`;
      msg.className = 'msg success';
      msg.classList.remove('hidden');
      setTimeout(() => msg.classList.add('hidden'), 2000);
      renderPositions();
    }

    document.getElementById('buy-btn').addEventListener('click', () => placeTrade('buy'));
    document.getElementById('sell-btn').addEventListener('click', () => placeTrade('sell'));

    // Simulate price movement
    setInterval(() => {
      pairs.forEach(p => {
        const change = (Math.random() - 0.5) * 0.0008 * p.price;
        p.price = Math.max(0.0001, p.price + change);
      });
      renderPairs();
      updateSelected();
    }, 2000);

    renderPairs();
    updateSelected();
    updateBalance();
  </script>
</body>
</html>
